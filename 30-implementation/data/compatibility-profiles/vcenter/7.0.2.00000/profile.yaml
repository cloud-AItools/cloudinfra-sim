# GET /api/appliance/system/version. version·build: KB 326316, 출시일 2021-03-09.
# /api 경로는 7.0 U2에서 도입되었으나(VMware 블로그 'vSphere 7 Update 2 REST API Modernization') 7.0 U2용 SDK 계약을 확보하지
# 않았다. REST API는 이 프로파일의 실행 범위에 넣지 않는다(7.0.3.2 SDK 계약을 그대로 적용하지 않음, R-08). 값 형식은 가정이다.
appliance_version:
  product: VMware vCenter Server
  type: vCenter Server with an embedded Platform Services Controller
  version: 7.0.2.00000
  build: "17694817"
  releasedate: "March 9, 2021"
  summary: Update for VMware vCenter Server 7.0
# 타입 메타데이터는 버전별 도입 정보를 모두 담은 단일 파일(pyVmomi 9.1.1.0)이다. 7.0.3 프로파일과 같은 파일을 쓴다(복사 아님:
# 파일 안에 버전별 since가 있어 세션 버전 7.0.2.0으로 필터링한다).
# 수신 TLS 버전(R-45 ③, 2026-10-11 결정): vSphere는 8.0 U3부터 TLS 1.3을 지원한다(KB 377237). 7.0 TLS Configurator는 1.0 ~ 1.2만 다룬다(KB 313841).
tls:
  max_version: "1.2"
  basis: KB 377237, KB 313841 — 7.0에 TLS 1.3 없음(문서상 추론). 하한은 Gateway 기본 1.2.
